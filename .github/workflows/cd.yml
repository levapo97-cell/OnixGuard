# CD del frontend OnixGuard → despliega en el VPS (en push a main). Invoca el pipeline reutilizable.
name: cd
on:
  push:
    branches: [main]
jobs:
  cd:
    uses: levapo97-cell/onix-deploy/.github/workflows/reusable-cd.yml@main
    with:
      service: onixguard-frontend
      health_port: "80"
      health_path: "/healthz"
    secrets: inherit
